<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FF CLUB BD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080f1a;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}.app{width:100%;max-width:720px;min-height:100vh;margin:auto;background:#0b1320}
header{height:76px;background:#172336;display:flex;align-items:center;padding:10px 14px;gap:10px;position:sticky;top:0;z-index:20}
.logo{width:50px;height:50px}.brand{font-size:27px;font-weight:800;flex:1}.walletTop{background:#fff;color:#111;border-radius:24px;padding:7px 12px;font-weight:800}
.bell{font-size:23px;color:#ffd400}.content{padding:12px 15px 95px}.screen{display:none}.screen.active{display:block}
.title{height:62px;display:flex;align-items:center;font-size:26px;font-weight:800}.back{background:none;border:0;color:#fff;font-size:35px;margin-right:10px}.play{margin-left:auto;color:#37bdf4;font-size:30px}
.hero{height:240px;border-radius:3px;overflow:hidden;background:linear-gradient(135deg,#111d2b,#202b3a);position:relative}.hero:after{content:"FREE FIRE";position:absolute;right:18px;top:65px;font-size:38px;font-weight:900;color:#e9e1cf}.hero:before{content:"কিভাবে FREE FIRE মাঠ খেলবেন?";position:absolute;right:12px;top:110px;font-size:22px;font-weight:900;color:#eee0bc;z-index:2}
.dots{text-align:center;padding:12px}.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin:0 5px}.dots i.on{width:34px;border-radius:8px;background:#0bc2d8}
.help{height:116px;border:1px solid #12608b;border-radius:24px;background:linear-gradient(135deg,#173d5d,#28234f);display:flex;align-items:center;padding:18px;gap:13px;box-shadow:0 0 12px #074a6c}.helpIcon{font-size:34px}.help h2{font-size:21px;margin:0 0 5px}.help p{margin:0;color:#aeb7c5;font-weight:700}.contact{margin-left:auto;background:linear-gradient(90deg,#28618f,#552486);border:1px solid #6680a5;border-radius:22px;padding:10px 16px;color:#fff;font-weight:800}
.tabs{height:80px;border:2px solid #202a39;border-radius:25px;display:flex;margin:25px 0 18px;overflow:hidden}.tabs button{flex:1;border:0;background:transparent;color:#aaa;font-size:21px;font-weight:800}.tabs button.active{background:#08b9cf;color:#fff;border-radius:20px;box-shadow:0 0 15px #078fa2}
.card{height:170px;margin:13px 0;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(100deg,#18212c,#26343d)}.card .art{position:absolute;inset:0;opacity:.4;background:radial-gradient(circle at 75% 45%,#a55b2d,transparent 28%),linear-gradient(135deg,#172f3a,#14202c)}.card .text{position:absolute;left:140px;top:55px}.card h3{margin:0;font-size:23px}.card p{margin:8px 0;color:#929baa;font-weight:800;letter-spacing:2px}.count{position:absolute;right:0;top:0;background:#ffe42c;color:#111;padding:10px;border-radius:50%;font-weight:900}
.otherGrid,.modeGrid,.packGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.other{height:320px;border-radius:25px;color:#fff;border:2px solid;font-weight:900;font-size:25px;display:flex;flex-direction:column;align-items:center;justify-content:center}.other small{color:#bbc0ca;margin-top:8px;font-size:16px}.diamond{font-size:60px}.top{background:#0b5866;border-color:#00a1b9;box-shadow:0 0 15px #008b9e}.shop{background:#64243e;border-color:#a42d62;box-shadow:0 0 15px #a42d62}
.mode{background:#292929;border:3px solid #3c4665;border-radius:18px;overflow:hidden;text-align:center}.mode .pic{height:155px;background:linear-gradient(135deg,#425b85,#1b2b43);display:flex;align-items:center;justify-content:center;font-size:54px}.mode h3{margin:11px 2px 5px;font-size:19px}.mode p{margin:0 0 12px;color:#aaa;font-weight:700;font-size:14px}
.match{background:#fff;color:#171717;border-radius:20px;margin:13px 0;overflow:hidden}.matchTop{padding:18px}.matchTitle{font-size:21px;font-weight:900}.meta{color:#777;margin:7px 0}.chips span{display:inline-block;border-radius:18px;padding:7px 11px;margin-right:5px;background:#e8f7e8;color:#398d48;border:1px solid #a9d7af}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin-top:15px}.stats b{font-size:37px}.stats b.green{color:#31954c}.stats small{display:block;color:#777;letter-spacing:2px}.join{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.join button{border:0;border-radius:14px;padding:12px 20px;color:#fff;font-weight:900;background:#329444}.join button.closed{background:#d62d30}.timer{background:#34a14a;color:#fff;padding:16px;text-align:center;font-weight:900}.tabs2{display:flex;border-bottom:2px solid #777;margin-bottom:8px}.tabs2 button{flex:1;background:none;border:0;color:#999;padding:12px;font-weight:900}.tabs2 button.active{color:#ffe500;border-bottom:4px solid #ffe500}
.login{min-height:100vh;background:#0b1320;padding:100px 35px;text-align:center}.login .bigLogo{margin:auto}.login h1{font-size:44px;margin:35px 0 5px}.login h2{font-size:23px;margin:0 0 35px}.login input{width:100%;height:54px;margin:7px 0;background:#101a28;border:2px solid #4d535e;border-radius:9px;color:#fff;padding:0 15px}.yellow{width:100%;height:55px;border:0;border-radius:0 0 25px 25px;background:#ffc400;color:#111;font-size:20px;font-weight:900;margin-top:12px}.terms{color:#999;font-size:13px;margin-top:16px}.terms b{color:#08c8df}
.profileHead{background:#182538;padding:20px;border-radius:0 0 25px 25px}.avatar{width:88px;height:88px;border-radius:50%;border:4px solid #ffe600;background:#31405a;display:inline-flex;align-items:center;justify-content:center;font-size:42px}.profileName{display:inline-block;vertical-align:top;margin:10px 0 0 15px}.profileName b{font-size:23px}.uid{color:#a8b0bd;margin:10px 0}.balance{border:2px solid #2a3546;border-radius:22px;padding:18px;margin-top:15px}.balance .num{font-size:34px;font-weight:900}.add{float:right;background:#4eb54c;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:900}
.section{color:#919aaa;letter-spacing:4px;font-weight:800;margin:25px 4px 10px}.row{height:68px;background:#101a29;border:2px solid #202c3c;border-radius:17px;margin:10px 0;padding:0 20px;display:flex;align-items:center;font-size:19px;font-weight:800}.row span{margin-left:auto;color:#aaa}
.pack{height:290px;border:2px solid #283345;background:#101928;border-radius:25px;text-align:center;padding:20px;position:relative}.pack h3{margin:0;font-size:19px}.gem{font-size:75px;margin:35px 0 25px}.price{display:inline-block;background:#202b3a;border:2px solid #3b4657;color:#189af0;border-radius:17px;padding:8px 18px;font-size:21px;font-weight:900}.best{position:absolute;left:-2px;top:-2px;background:#ff3d85;padding:7px 11px;border-radius:15px 0 15px 0;font-size:11px;font-weight:900}
.walletBox{background:#fff;color:#111;border-radius:20px;padding:20px;text-align:center}.walletBox .big{font-size:60px;font-weight:900}.walletBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:18px}.walletBtns button{border:0;border-radius:10px;color:#fff;padding:14px 3px;font-weight:900}.deposit{background:#318b3a}.withdraw{background:#c82b2b}.gift{background:#1769ba}.videoRow{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-weight:800}.videoRow button{background:#c92c2c;border:0;color:#fff;border-radius:10px;padding:11px 14px;font-weight:900}.statements{height:560px;background:#fff;color:#111;border-radius:20px;text-align:center;padding:20px;font-size:22px;font-weight:800}.statements .empty{margin-top:210px;color:#aaa}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:76px;background:#253246;border-radius:30px 30px 0 0;display:flex;padding:8px 28px;z-index:30}.nav{flex:1;border:0;background:transparent;color:#aaa;font-size:32px;border-radius:25px}.nav.active{background:#697486;color:#fff}
@media(max-width:480px){.brand{font-size:25px}.hero{height:240px}.other{height:300px}.mode .pic{height:135px}.card{height:155px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY="ffclub_user_v1";
const uid=()=>String(Math.floor(100000+Math.random()*899999));
function getUser(){return JSON.parse(localStorage.getItem(KEY)||"null")}
function saveUser(u){localStorage.setItem(KEY,JSON.stringify(u))}
function logo(){return `<svg class="logo bigLogo" viewBox="0 0 100 100"><path d="M50 5 90 18v35c0 24-17 36-40 42C27 89 10 77 10 53V18z" fill="#2025d8"/><path d="M18 25 50 15l32 10v27c0 18-12 27-32 34C30 79 18 70 18 52z" fill="#111a2a"/><text x="50" y="47" text-anchor="middle" font-size="15" font-weight="900" fill="white">FF</text><text x="50" y="64" text-anchor="middle" font-size="12" font-weight="900" fill="#8cff45">CLUB BD</text></svg>`}
function shell(){return `<header>${logo()}<div class="brand">FF CLUB BD</div><div class="bell">🔔</div><div class="walletTop">৳ 0.00</div></header><div class="content" id="content"></div><nav><button class="nav active" id="homeNav" onclick="home()">⌂</button><button class="nav" id="profileNav" onclick="profile()">♟</button></nav>`}
function home(){
document.getElementById("content").innerHTML=`<section class="screen active">
<div class="hero"></div><div class="dots"><i></i><i class="on"></i><i></i></div>
<div class="help"><div class="helpIcon">🎧</div><div><h2>Need any Help?</h2><p>Customer Support</p></div><button class="contact">Contact ›</button></div>
<div class="tabs"><button class="active" onclick="games()">🎮 Games</button><button onclick="others()">▦ Others</button></div>
<div id="homeBody"></div></section>`; games()}
function games(){document.querySelector(".tabs button:first-child").classList.add("active");document.querySelector(".tabs button:last-child").classList.remove("active");document.getElementById("homeBody").innerHTML=`<div class="card" onclick="matches()"><div class="art"></div><div class="text"><h3>Free Fire Matches</h3><p>JOIN THE BATTLE</p></div><span class="count">0</span></div><div class="card"><div class="art"></div><div class="text"><h3>Ludo King</h3><p>REGULAR 1 VS 1</p></div></div>`}
function others(){document.querySelector(".tabs button:first-child").classList.remove("active");document.querySelector(".tabs button:last-child").classList.add("active");document.getElementById("homeBody").innerHTML=`<div class="otherGrid"><button class="other top" onclick="topup()"><div class="diamond">💎</div>Top Up<small>Buy Diamonds</small></button><button class="other shop"><div class="diamond">🛍️</div>Shop<small>Browse Products</small></button></div>`}
function profile(){const u=getUser();document.getElementById("profileNav").classList.add("active");document.getElementById("homeNav").classList.remove("active");document.getElementById("content").innerHTML=`<section class="screen active"><div class="profileHead"><div class="avatar">👤</div><div class="profileName"><b>${u?u.name:"Guest User"}</b><br><span>${u?u.phone:"—"}</span></div><div class="uid">UID: ${u?u.uid:"—"}</div><div class="balance"><b>AVAILABLE BALANCE</b><br><span class="num">BDT 0.00</span><button class="add" onclick="topup()">＋ ADD</button></div></div><div class="section">ACCOUNT</div><div class="row" onclick="wallet()">▣　My Wallet <span>›</span></div><div class="row">↔　All Statements <span>›</span></div><div class="row">◉　Refer & Earn <span>NEW　›</span></div><div class="section">GAME CENTER</div><div class="row" onclick="modes()">♛　Leaderboard <span>NEW　›</span></div><div class="section">MORE</div><div class="row">ⓘ　Terms and Conditions <span>›</span></div><div class="row">‹/›　Developer Profile <span>›</span></div></section>`}
function title(t,back="home"){return `<div class="title"><button class="back" onclick="${back}()">‹</button>${t}<span class="play">▶</span></div>`}
function modes(){document.getElementById("content").innerHTML=`<section class="screen active">${title("Select Mode")}<div class="modeGrid">${["BR MATCH","PRO LEAGUE","SURVIVAL","CS 4 VS 4","CLASH SQUAD","LONE WOLF","HEADSHOT ONLY","LOSE TO WIN"].map((x,i)=>`<div class="mode"><div class="pic">${["🎮","🏆","🏍️","⚔️","🪖","🥊","🎯","💥"][i]}</div><h3>${x}</h3><p>${[45,23,34,65,51,100,12,18][i]} matches available</p></div>`).join("")}</div></section>`}
function matches(){document.getElementById("content").innerHTML=`<section class="screen active">${title("Free Fire Matches")}<div class="tabs2"><button class="active">🎮 ONGOING</button><button>🏆 RESULTS</button></div>${[159405,159406,159407,159408].map((n,i)=>`<div class="match"><div class="matchTop"><div class="matchTitle">${i?"CS RANDOM":"PRO LEAGUE II"} | Match No.${n}</div><div class="meta">◷ 16 Aug 2026, ${i+3}:30 PM</div><div class="chips"><span>Map: Bermuda</span><span>Type: Squad</span></div><div class="stats"><div><small>TOTAL PRIZE</small><b class="green">${i?320:390}</b></div><div><small>PER KILL</small><b>0</b></div><div><small>ENTRY FEE</small><b>${i?10:10}</b></div></div><div class="join"><span>24 Players Need</span><button>JOIN</button></div></div><div class="timer">◷　STARTS IN:　00h　:　44m　:　22s</div></div>`).join("")}</section>`}
function topup(){document.getElementById("content").innerHTML=`<section class="screen active">${title("Top Up")}<div class="packGrid">${[[25,21],[50,36],[115,79],[240,155],[610,390],[1240,800],[2530,1600],["1x Weekly",155]].map((p,i)=>`<div class="pack">${[2,3,7].includes(i)?'<span class="best">★ BEST SELLER</span>':''}<h3>${p[0]} Diamond</h3><div class="gem">💎</div><div class="price">Tk ${p[1]}</div></div>`).join("")}</div></section>`}
function wallet(){document.getElementById("content").innerHTML=`<section class="screen active">${title("Wallet","profile")}<div class="walletBox"><div style="color:#aaa;letter-spacing:3px">AVAILABLE BALANCE</div><div class="big">0.00</div><b>Winning Balance　0</b><div class="walletBtns"><button class="deposit">＋ DEPOSIT</button><button class="withdraw">▣ WITHDRAW</button><button class="gift">♧ GIFT</button></div></div><div class="videoRow"><span>কিভাবে টাকা ডিপোজিট করবেন?</span><button>ভিডিও দেখুন</button></div><div class="videoRow"><span>কিভাবে বন্ধুকে গিফট পাঠাবেন?</span><button>ভিডিও দেখুন</button></div><div class="statements">Mini Statements<div class="empty">▱<br>No transactions available.</div></div></section>`}
function login(){document.getElementById("app").innerHTML=`<div class="login">${logo()}<h1>Get Started</h1><h2>Login/Signup</h2><input id="name" placeholder="Enter your name"><input id="phone" placeholder="Enter your phone number"><button class="yellow" onclick="signup()">CONTINUE</button><div class="terms">By continuing, I hereby confirm that I am 18 years of age or above<br>and I agree to the <b>Terms and Conditions</b> and <b>Privacy Policy</b>.</div></div>`}
function signup(){const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim();if(!name||!phone)return alert("Name and phone number দিন");let u=getUser();if(u&&u.phone===phone){saveUser({...u,name});start();return}saveUser({name,phone,uid:uid(),balance:0});start()}
function start(){document.getElementById("app").innerHTML=shell();home()}
if(getUser())start();else login();
</script>
</body>
</html>
