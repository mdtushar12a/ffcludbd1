<head>
<meta charset="utf-8">

<title>FF CLUB BD</title>
<style>
:root{--bg:#0c1421;--panel:#172337;--panel2:#101a29;--white:#fff;--muted:#9da6b4;--yellow:#ffd400;--cyan:#19c8e6;--green:#43aa4b;--red:#df3035;--blue:#299af0}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}.app{width:min(720px,100%);min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
header{height:76px;background:#19263a;display:flex;align-items:center;padding:9px 16px;gap:10px}
.logo{width:52px;height:52px;object-fit:contain}.brand{font-size:27px;font-weight:800;flex:1;white-space:nowrap}.bell{font-size:25px;color:#ffd400}.badge{background:#f03c39;color:#fff;border-radius:50%;font-size:13px;padding:5px 7px;margin-left:-17px;margin-right:2px;font-weight:900}.topbal{background:#fff;color:#111;border-radius:24px;padding:7px 12px;font-size:20px;font-weight:900;white-space:nowrap}
main{padding:0 26px 92px}.view{display:none}.view.active{display:block}.title{height:82px;display:flex;align-items:center;font-size:28px;font-weight:800}.back{border:0;background:none;color:#fff;font-size:42px;line-height:1;margin-right:18px;padding:0}.play{margin-left:auto;border:0;background:#37baf3;color:#102033;border-radius:50%;width:44px;height:44px;font-size:22px}
.hero{height:270px;margin:0 -26px;background:linear-gradient(110deg,#131c29,#222c3a 55%,#111b2a);position:relative;overflow:hidden}.hero:before{content:"FREE FIRE";position:absolute;right:30px;top:72px;font-size:47px;font-weight:1000;font-style:italic;color:#eee4ca}.hero:after{content:"কিভাবে FREE FIRE মাঠ খেলবেন?";position:absolute;right:23px;top:128px;font-size:28px;font-weight:900;color:#eee4ca}.heroChar{position:absolute;left:10px;bottom:-5px;font-size:170px;filter:saturate(.8)}
.dots{text-align:center;padding:16px}.dots i{display:inline-block;width:11px;height:11px;background:#555;border-radius:50%;margin:0 6px}.dots i.on{width:38px;border-radius:10px;background:#12c7dd}
.help{min-height:126px;border:2px solid #16557d;border-radius:25px;background:linear-gradient(135deg,#153b5b,#29214e);display:flex;align-items:center;padding:18px;gap:15px;box-shadow:0 0 14px #073e5a}.helpIcon{font-size:38px}.help h2{font-size:22px;margin:0 0 5px}.help p{color:#aeb7c5;font-size:18px;font-weight:700;margin:0}.contact{margin-left:auto;background:linear-gradient(90deg,#28618e,#542282);border:1px solid #6d83a5;color:#fff;border-radius:22px;padding:11px 18px;font-weight:800}
.tabs{height:91px;border:2px solid #222c3b;border-radius:25px;display:flex;margin:30px 0 20px;overflow:hidden}.tabs button{flex:1;border:0;background:transparent;color:#aaa;font-size:22px;font-weight:900}.tabs button.active{background:#0bbbd0;color:#fff;border-radius:22px;box-shadow:0 0 16px #07899c}
.gameCard{height:180px;margin:14px 0;border-radius:20px;position:relative;overflow:hidden;background:#17212c;border:1px solid #172838}.gameArt{position:absolute;inset:0;background:radial-gradient(circle at 80% 40%,#7a4d29,#24343a 28%,#16232e 60%);opacity:.85}.gameIcon{position:absolute;left:25px;top:45px;width:76px;height:76px;border-radius:15px;background:#29313d;display:grid;place-items:center;font-size:38px}.gameText{position:absolute;left:145px;top:56px}.gameText h3{margin:0;font-size:24px}.gameText p{margin:8px 0;color:#7f8795;letter-spacing:3px;font-weight:800}.count{position:absolute;right:-1px;top:-1px;background:#ffe32a;color:#111;border-radius:50%;padding:11px;font-weight:900}
.otherGrid,.modeGrid,.shopGrid,.packGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.other{height:330px;border-radius:27px;border:2px solid;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:25px;font-weight:900}.other small{color:#b9c0c9;margin-top:8px}.other.top{background:#075461;border-color:#00a8bf;box-shadow:0 0 14px #007b8b}.other.shop{background:#63243d;border-color:#aa2f65;box-shadow:0 0 14px #a42d62}.ico{font-size:62px;margin-bottom:38px}
.mode{background:#292929;border:4px solid #3d4764;border-radius:18px;overflow:hidden;text-align:center}.modePic{height:190px;background:linear-gradient(135deg,#6476a0,#1e2a40);display:grid;place-items:center;font-size:70px}.mode h3{font-size:22px;margin:12px 5px 7px}.mode p{color:#aaa;margin:0 0 13px;font-weight:700}
.matchTabs{height:110px;display:flex;border-bottom:2px solid #89909c;margin:0 -26px 14px}.matchTabs button{flex:1;border:0;background:transparent;color:#aaa;font-size:21px;font-weight:900;position:relative}.matchTabs button.active{color:#ffe500}.matchTabs button.active:after{content:"";position:absolute;bottom:-2px;left:25%;right:25%;height:5px;background:#ffe500;border-radius:5px}
.match{background:#fff;color:#1d1d1d;border-radius:20px;margin:20px 0;overflow:hidden}.matchBody{padding:20px}.matchHead{display:flex;gap:15px}.matchIcon{width:80px;height:80px;border-radius:14px;background:linear-gradient(135deg,#a9d6ff,#425f89);display:grid;place-items:center;font-size:38px;flex:none}.matchTitle{font-size:24px;font-weight:900;line-height:1.15}.meta{color:#777;font-size:17px;margin-top:8px}.chips{margin:12px 0}.chip{display:inline-block;border-radius:18px;padding:8px 12px;margin-right:5px;font-weight:800}.chip.green{background:#e9f7ea;border:2px solid #b4dbb7;color:#43914e}.chip.blue{background:#e9f5ff;border:2px solid #a8d5ef;color:#3185ba}.numbers{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin:14px 0}.numbers div{border-right:1px solid #ddd}.numbers div:last-child{border:0}.numbers small{display:block;color:#777;letter-spacing:4px;font-size:12px;font-weight:800}.numbers b{font-size:45px}.numbers b.green{color:#3b9b49}.more{color:#328ac2;background:#edf7ff;border-radius:15px;padding:5px 12px;display:inline-block;font-weight:900}.progress{height:11px;background:#eee;border-radius:10px;margin:8px 0}.progress span{display:block;width:50%;height:100%;background:#4ba7e6;border-radius:10px}.joinRow{display:flex;align-items:center;gap:8px}.need{border:2px solid #b6d8ed;color:#3285bb;background:#edf8ff;border-radius:20px;padding:8px 12px;font-weight:900}.slots{margin-left:auto;background:#f3f3f3;border-radius:18px;padding:8px 12px;color:#666}.join{border:0;background:#379443;color:#fff;border-radius:15px;padding:16px 27px;font-size:18px;font-weight:900}.closed{background:#df3035!important}.timer{background:#42ad4b;color:#fff;text-align:center;padding:16px;font-weight:900;letter-spacing:2px}.redtimer{background:#ef3034}.timebox{display:inline-block;background:#25833a;border-radius:8px;padding:7px 10px;margin-left:5px}.redtimer .timebox{background:#a52328}
.shopCard{background:#101a29;border:2px solid #283344;border-radius:25px;overflow:hidden;position:relative}.productPic{height:245px;background:linear-gradient(135deg,#46505e,#1d2736);display:grid;place-items:center;font-size:75px}.discount{position:absolute;right:12px;top:13px;background:#ff4788;border-radius:22px;padding:10px 15px;font-weight:900}.productInfo{padding:17px 20px}.productInfo h3{font-size:20px;margin:0 0 15px}.price{color:#229bf0;font-size:24px;font-weight:900}.old{text-decoration:line-through;color:#777;margin-left:8px;font-size:18px}
.pack{background:#101928;border:2px solid #283345;border-radius:25px;height:310px;text-align:center;padding:20px;position:relative}.best{position:absolute;left:-2px;top:-2px;background:#ff3d85;padding:8px 12px;border-radius:16px 0 16px 0;font-size:11px;font-weight:900}.pack h3{font-size:19px}.gem{font-size:75px;margin:42px 0}.pack .price{display:inline-block;background:#202b3a;border:2px solid #3b4657;border-radius:18px;padding:8px 18px}
.profile{background:#182538;margin:0 -26px;padding:25px 26px;border-radius:0 0 30px 30px}.avatar{width:92px;height:92px;border:4px solid #ffe400;border-radius:50%;background:#30405a;display:inline-grid;place-items:center;font-size:45px}.pname{display:inline-block;vertical-align:top;margin:10px 0 0 18px}.pname b{font-size:25px}.pname div{color:#aeb7c3;margin-top:6px}.uid{margin-top:15px;color:#b0b7c1}.balance{margin-top:15px;border:2px solid #2c384a;border-radius:23px;padding:18px}.balanceTitle{font-weight:900}.balanceNum{font-size:35px;font-weight:900}.add{float:right;background:#4db24d;border:0;color:#fff;border-radius:12px;padding:12px 18px;font-weight:900}.section{margin:27px 5px 12px;color:#939baa;letter-spacing:4px;font-weight:900}.row{height:72px;background:#101a29;border:2px solid #222d3d;border-radius:18px;margin:12px 0;padding:0 20px;display:flex;align-items:center;font-size:20px;font-weight:900}.row span{margin-left:auto;color:#999}
.walletBox{background:#fff;color:#111;border-radius:20px;padding:20px;text-align:center}.available{color:#aaa;letter-spacing:4px}.bigMoney{font-size:62px;font-weight:900;margin:8px}.win{background:#000;color:#fff;border-radius:20px;padding:5px 14px;display:inline-block}.walletBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:20px}.walletBtns button{border:0;color:#fff;border-radius:12px;padding:15px 4px;font-weight:900}.deposit{background:#328d3c}.withdraw{background:#ca2c2e}.gift{background:#1e69bb}.videoRow{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:18px;margin:20px 0}.videoRow button{border:0;background:#cc2c2c;color:#fff;border-radius:11px;padding:12px 16px;font-weight:900}.statements{background:#fff;color:#111;border-radius:20px;min-height:560px;text-align:center;padding:20px;font-size:24px;font-weight:900}.empty{margin-top:190px;color:#aaa}
.login{min-height:100vh;padding:185px 52px 30px;background:#0c1421;text-align:center}.loginLogo{width:120px;height:120px;object-fit:contain}.login h1{font-size:48px;margin:25px 0 4px}.login h2{font-size:27px;margin:0 0 40px}.phone{height:60px;border:2px solid #596171;border-radius:0;background:transparent;color:#fff;width:100%;font-size:22px;padding:0 15px}.continue{height:62px;width:100%;border:0;background:#ffbf08;color:#111;font-size:24px;font-weight:900;border-radius:0 0 25px 25px}.terms{font-size:14px;color:#9ca3ae;line-height:1.7;margin-top:18px}.terms a{color:#13c9e4;text-decoration:underline;font-weight:900}.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:25px}.otp input{width:100%;height:70px;background:transparent;border:2px solid #fff;color:#fff;text-align:center;font-size:28px;font-weight:900}.otp input:focus{outline:none}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:82px;background:#263347;border-radius:32px 32px 0 0;display:flex;padding:8px 32px;z-index:50}.navbtn{flex:1;border:0;background:transparent;color:#aaa;font-size:34px;border-radius:26px}.navbtn.active{background:#6d7788;color:#fff}
@media(max-width:520px){main{padding-left:26px;padding-right:26px}.hero{height:270px}.brand{font-size:24px}.other{height:310px}.modePic{height:150px}.matchTitle{font-size:21px}.login{padding-left:34px;padding-right:34px}}
</style>
